<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NT Developer Portal — España</title>
  <meta name="description" content="Documentación oficial de la API NT FactoSuite para desarrolladores. España.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/styles.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #0f172a;
      --ink-2: #475569;
      --brand: #4f46e5;
      --brand-light: #eef2ff;
      --success: #10b981;
      --border: #e2e8f0;
      --radius: 10px;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: #fff; color: var(--ink); }

    /* ── Top bar ── */
    .dev-topbar {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: .75rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .dev-topbar-left { display: flex; align-items: center; gap: 1rem; }
    .dev-topbar img { height: 28px; width: auto; }
    .dev-topbar-divider { width: 1px; height: 20px; background: #334155; }
    .dev-topbar-title { color: #e2e8f0; font-size: .85rem; font-weight: 600; letter-spacing: .02em; }
    .dev-topbar-badge { background: #1e293b; border: 1px solid #334155; color: #94a3b8; font-size: .7rem; padding: .2rem .6rem; border-radius: 100px; font-family: 'JetBrains Mono', monospace; }
    .dev-topbar-right { display: flex; align-items: center; gap: .75rem; }
    .dev-topbar a.back { color: #94a3b8; font-size: .8rem; text-decoration: none; display: flex; align-items: center; gap: .3rem; transition: color .2s; }
    .dev-topbar a.back:hover { color: #818cf8; }
    .dev-topbar a.back svg { width: 14px; height: 14px; }
    .dev-topbar a.spec-link { color: #818cf8; font-size: .8rem; text-decoration: none; font-family: 'JetBrains Mono', monospace; border: 1px solid #334155; padding: .25rem .65rem; border-radius: 6px; transition: all .2s; }
    .dev-topbar a.spec-link:hover { background: #1e293b; color: #a5b4fc; }

    /* ── Hero ── */
    /* ── Compact info bar (replaces tall hero) ── */
    .dev-hero {
      background: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: .6rem 2rem;
    }
    .dev-hero-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }
    .dev-hero-kicker {
      font-size: .7rem;
      font-weight: 700;
      color: #818cf8;
      letter-spacing: .07em;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
      white-space: nowrap;
    }
    .dev-hero-sep { width: 1px; height: 14px; background: #1e293b; flex-shrink: 0; }
    .dev-hero h1 { display: none; }
    .dev-hero p  { display: none; }
    /* Quick start pills (replaces cards) */
    .qs-grid {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      flex: 1;
    }
    .qs-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 100px;
      padding: .3rem .85rem;
      white-space: nowrap;
      transition: border-color .2s;
    }
    .qs-card:hover { border-color: #818cf8; }
    .qs-card-step { display: none; }
    .qs-card h3 {
      font-size: .72rem;
      font-weight: 600;
      color: #94a3b8;
      margin: 0;
    }
    .qs-card p { display: none; }
    .qs-card code {
      font-family: 'JetBrains Mono', monospace;
      font-size: .7rem;
      color: #7dd3fc;
    }

    /* ── Stoplight wrapper ── */
    .stoplight-wrap {
      height: calc(100vh - 94px);
      min-height: 500px;
    }
    elements-api {
      display: block;
      height: 100%;
    }
  </style>
</head>
<body>
  <!-- ── Auth guard ── -->
  <script>
    (function() {
      var token = sessionStorage.getItem('nt_dev_token');
      if (!token) { window.location.replace('./login.html'); }
    })();
  </script>


  <!-- TOP BAR -->
  <div class="dev-topbar">
    <div class="dev-topbar-left">
      <img src="../assets/images/logos/nt-white.png" alt="Next Technologies">
      <div class="dev-topbar-divider"></div>
      <span class="dev-topbar-title">Developer Portal</span>
      <span class="dev-topbar-badge">v3.1.0 · España</span>
    </div>
    <div class="dev-topbar-right">
      <span id="user-badge" style="font-size:.75rem;color:#64748b;font-family:'JetBrains Mono',monospace;background:#0f172a;border:1px solid #1e293b;padding:.2rem .65rem;border-radius:100px;"></span>
      <button onclick="logout()" style="background:none;border:1px solid #1e293b;color:#64748b;font-size:.75rem;padding:.2rem .65rem;border-radius:100px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .2s;" onmouseover="this.style.color='#f87171';this.style.borderColor='#f87171'" onmouseout="this.style.color='#64748b';this.style.borderColor='#1e293b'">Cerrar sesión</button>
      <a href="./openapi.yaml" class="spec-link" target="_blank">openapi.yaml</a>
      <a href="../index.html" class="back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Sitio principal
      </a>
    </div>
  </div>

  <!-- HERO -->
  <div class="dev-hero">
    <div class="dev-hero-inner">
      <div class="dev-hero-kicker">NT FactoSuite API · FacturaE / Verifactu</div>
      <div class="dev-hero-sep"></div>
      <div class="qs-grid">
        <div class="qs-card"><h3>POST <code>/auth/token</code></h3></div>
        <div class="qs-card"><h3>POST <code>/emitir</code></h3></div>
        <div class="qs-card"><h3>Webhooks</h3></div>
        <div class="qs-card"><h3>Hospitality</h3></div>
      </div>
    </div>
  </div>
  <!-- STOPLIGHT ELEMENTS -->
  <div class="stoplight-wrap">
    <elements-api
      id="elements-api"
      router="hash"
      layout="sidebar"
      hideTryIt="false"
    ></elements-api>
  </div>

  <script src="vendor/web-components.min.js"></script>
  <script>
    // Embed spec inline to avoid file:// CORS restrictions
    const spec = `openapi: 3.1.0
info:
  title: "NT FactoSuite API — España"
  version: "3.1.0"
  description: |
    API REST de NT FactoSuite para España.

    **Estándar fiscal:** FacturaE / Verifactu / TicketBAI

    Todos los endpoints requieren autenticación mediante Bearer JWT.
    Obtén tu token en \`POST /auth/token\` usando tu API Key de producción o sandbox.

    **Ambientes:**
    - Producción: \`https://api.next-technologies.es/v3\`
    - Sandbox: \`https://sandbox-api.next-technologies.es/v3\`

    **Soporte técnico:** dev@next-technologies.es
  contact:
    name: NT Developer Support
    email: dev@next-technologies.es
    url: https://next-technologies.es/developers
  license:
    name: Uso privado — NT Group
    identifier: LicenseRef-NT-Private

servers:
  - url: "https://api.next-technologies.es/v3"
    description: Producción
  - url: "https://sandbox-api.next-technologies.es/v3"
    description: Sandbox (pruebas)

security:
  - BearerAuth: []

tags:
  - name: Autenticación
    description: Obtención y renovación de tokens JWT
  - name: "FacturaE"
    description: "Emisión de factura electrónica FacturaE, Verifactu y TicketBAI conforme a la normativa de la AEAT."
  - name: Hospitality
    description: "Facturación FacturaE para hoteles. Integración Opera PMS y Micros POS."
  - name: Orders
    description: Gestión de órdenes de compra y aprobaciones
  - name: "Validación AEAT"
    description: "Verificación de factura electrónica ante la AEAT. Devuelve estado válido/anulado."
  - name: Webhooks
    description: Notificaciones en tiempo real de eventos fiscales

paths:
  /auth/token:
    post:
      tags: [Autenticación]
      summary: Obtener JWT
      description: |
        Intercambia tu API Key por un Bearer JWT con expiración de 1 hora.
        El token debe enviarse en el header \`Authorization: Bearer <token>\`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [api_key, api_secret]
              properties:
                api_key:
                  type: string
                  example: "nt_live_pk_abc123xyz"
                  description: API Key pública de tu cuenta NT
                api_secret:
                  type: string
                  example: "nt_live_sk_•••••••••"
                  description: API Secret privado (nunca expongas esto en frontend)
      responses:
        "200":
          description: Token generado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/token/refresh:
    post:
      tags: [Autenticación]
      summary: Renovar JWT
      description: Renueva un token próximo a expirar sin necesidad de re-autenticarse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
                  example: "nt_rt_xxxxxxxxxxxxxx"
      responses:
        "200":
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"

  /factura/emitir:
    post:
      tags: ["FacturaE"]
      summary: Emitir comprobante
      description: |
        Genera y timbra un comprobante fiscal electrónico.
        El documento es sellado digitalmente y enviado al SAT/DGII/DIAN/AEAT.
        Responde con el UUID y el XML timbrado en Base64.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmitirRequest"
            example:
              emisor:
                rfc: "B12345678"
                nombre: "EMPRESA DEMO SA DE CV"
                regimen_fiscal: "601"
              receptor:
                rfc: "XAXX010101000"
                nombre: "PUBLICO EN GENERAL"
                uso_cfdi: "G03"
              conceptos:
                - descripcion: "Servicio de software empresarial"
                  unidad: "E48"
                  cantidad: 1
                  valor_unitario: 10000.00
                  importe: 10000.00
                  traslados:
                    - impuesto: "002"
                      tipo: "Tasa"
                      tasa: 0.16
                      importe: 1600.00
      responses:
        "201":
          description: Comprobante emitido y timbrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteEmitido"
        "422":
          $ref: "#/components/responses/ValidationError"

  /factura/{id}:
    get:
      tags: ["FacturaE"]
      summary: Consultar comprobante
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: "6128396f-c09b-4ec6-8699-43c5f7e3b230"
      responses:
        "200":
          description: Detalle del comprobante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteEmitido"
        "404":
          $ref: "#/components/responses/NotFound"

  /factura/{id}/anular:
    post:
      tags: ["FacturaE"]
      summary: Cancelar comprobante
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo:
                  type: string
                  enum: ["01", "02", "03", "04"]
                  description: |
                    Motivo de cancelación:
                    - 01: Comprobante emitido con errores con relación
                    - 02: Comprobante emitido con errores sin relación
                    - 03: No se llevó a cabo la operación
                    - 04: Operación nominativa relacionada en una factura global
                uuid_relacionado:
                  type: string
                  format: uuid
                  description: UUID del comprobante sustituto (requerido para motivo 01)
      responses:
        "200":
          description: Solicitud de cancelación enviada
          content:
            application/json:
              schema:
                type: object
                properties:
                  estado_cancelacion:
                    type: string
                    enum: [cancelado, en_proceso, rechazado]
                  mensaje:
                    type: string

  /hospitality/factura:
    post:
      tags: [Hospitality]
      summary: Factura de hotel/restaurante
      description: |
        Genera factura electrónica a partir de un folio de hospedaje o consumo.
        Compatible con Opera PMS, Micros POS y otros sistemas vía webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HospitalityFacturaRequest"
      responses:
        "201":
          description: Factura generada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteEmitido"

  /hospitality/autofactura:
    post:
      tags: [Hospitality]
      summary: Portal de autofactura
      description: |
        Emite comprobante a partir de datos ingresados por el huésped en el portal
        de autofactura personalizable del hotel.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [folio, rfc_receptor, email]
              properties:
                folio:
                  type: string
                  example: "H-2026-00841"
                rfc_receptor:
                  type: string
                  example: "B12345678"
                email:
                  type: string
                  format: email
                  example: "administracion@empresa.com"
      responses:
        "201":
          description: Comprobante enviado al email del receptor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComprobanteEmitido"

  /orders/orden:
    post:
      tags: [Orders]
      summary: Crear orden de compra
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrdenRequest"
      responses:
        "201":
          description: Orden creada en estado pendiente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenResponse"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Consultar orden
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalle de la orden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdenResponse"

  /orders/{id}/aprobar:
    patch:
      tags: [Orders]
      summary: Aprobar o rechazar orden
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion:
                  type: string
                  enum: [aprobar, rechazar]
                comentario:
                  type: string
      responses:
        "200":
          description: Estado de la orden actualizado

  /valid/verificar-factura:
    post:
      tags: ["Validación AEAT"]
      summary: Verificar comprobante
      description: "Verificación de factura electrónica ante la AEAT. Devuelve estado válido/anulado."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid:
                  type: string
                  format: uuid
                  example: "6128396f-c09b-4ec6-8699-43c5f7e3b230"
      responses:
        "200":
          description: Estado de validación
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                  estado:
                    type: string
                    enum: [vigente, cancelado, no_encontrado]
                  fecha_emision:
                    type: string
                    format: date-time
                  emisor_rfc:
                    type: string
                  receptor_rfc:
                    type: string
                  total:
                    type: number

  /webhooks:
    get:
      tags: [Webhooks]
      summary: Listar webhooks configurados
      responses:
        "200":
          description: Lista de webhooks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Webhook"
    post:
      tags: [Webhooks]
      summary: Registrar webhook
      description: |
        Configura una URL para recibir notificaciones en tiempo real cuando:
        - Un comprobante es timbrado exitosamente
        - Un comprobante es cancelado
        - Una orden de compra cambia de estado
        - Un comprobante falla el timbrado
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookCreate"
      responses:
        "201":
          description: Webhook registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webhook"

  /webhooks/{id}:
    delete:
      tags: [Webhooks]
      summary: Eliminar webhook
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Webhook eliminado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtenido en POST /auth/token

  responses:
    Unauthorized:
      description: No autenticado o token expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            codigo: "AUTH_001"
            mensaje: "Token inválido o expirado. Obtén uno nuevo en POST /auth/token."
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Error de validación en los datos enviados
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "eyJhbGciOiJSUzI1NiJ9..."
        token_type:
          type: string
          example: "Bearer"
        expires_in:
          type: integer
          example: 3600
          description: Segundos hasta la expiración
        refresh_token:
          type: string
          example: "nt_rt_xxxxxxxxxxxxxx"

    EmitirRequest:
      type: object
      required: [emisor, receptor, conceptos]
      properties:
        emisor:
          type: object
          required: [rfc, nombre, regimen_fiscal]
          properties:
            rfc:
              type: string
              example: "B12345678"
            nombre:
              type: string
            regimen_fiscal:
              type: string
              example: "601"
        receptor:
          type: object
          required: [rfc, nombre]
          properties:
            rfc:
              type: string
            nombre:
              type: string
            uso_cfdi:
              type: string
              example: "G03"
        conceptos:
          type: array
          minItems: 1
          items:
            type: object
            required: [descripcion, cantidad, valor_unitario, importe]
            properties:
              descripcion:
                type: string
              cantidad:
                type: number
              valor_unitario:
                type: number
              importe:
                type: number
        serie:
          type: string
          example: "A"
        folio:
          type: string
          example: "1001"

    ComprobanteEmitido:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
          example: "6128396f-c09b-4ec6-8699-43c5f7e3b230"
        serie:
          type: string
        folio:
          type: string
        fecha:
          type: string
          format: date-time
        sello_sat:
          type: string
        noCertificadoSAT:
          type: string
        estado:
          type: string
          enum: [vigente, cancelado, en_proceso]
        xml_base64:
          type: string
          format: byte
          description: XML timbrado codificado en Base64
        pdf_url:
          type: string
          format: uri
          description: URL temporal del PDF (24 horas)
        total:
          type: number

    HospitalityFacturaRequest:
      type: object
      required: [folio_pms, emisor_rfc, receptor_rfc]
      properties:
        folio_pms:
          type: string
          example: "RES-2026-4821"
          description: Número de reservación o folio del PMS (Opera, Innsist, etc.)
        emisor_rfc:
          type: string
          example: "B12345678"
        receptor_rfc:
          type: string
        receptor_nombre:
          type: string
        receptor_email:
          type: string
          format: email
        uso_cfdi:
          type: string
          example: "D10"

    OrdenRequest:
      type: object
      required: [proveedor_id, conceptos]
      properties:
        proveedor_id:
          type: string
          example: "prov_abc123"
        centro_costo:
          type: string
          example: "CC-OPERACIONES"
        conceptos:
          type: array
          items:
            type: object
            properties:
              descripcion:
                type: string
              cantidad:
                type: number
              precio_unitario:
                type: number

    OrdenResponse:
      type: object
      properties:
        id:
          type: string
          example: "ord_2026_00491"
        estado:
          type: string
          enum: [pendiente, aprobada, rechazada, cancelada]
        total:
          type: number
        creada_en:
          type: string
          format: date-time
        aprobador:
          type: string

    Webhook:
      type: object
      properties:
        id:
          type: string
          example: "wh_xyz789"
        url:
          type: string
          format: uri
        eventos:
          type: array
          items:
            type: string
            enum: [cfdi.emitido, cfdi.cancelado, orden.aprobada, cfdi.error]
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time

    WebhookCreate:
      type: object
      required: [url, eventos]
      properties:
        url:
          type: string
          format: uri
          example: "https://tuapp.com/webhooks/nt"
        eventos:
          type: array
          items:
            type: string
            enum: [cfdi.emitido, cfdi.cancelado, orden.aprobada, cfdi.error]
          example: [cfdi.emitido, cfdi.cancelado]
        secret:
          type: string
          description: Secreto HMAC-SHA256 para verificar autenticidad del payload

    Error:
      type: object
      properties:
        codigo:
          type: string
        mensaje:
          type: string

    ValidationErrorResponse:
      type: object
      properties:
        codigo:
          type: string
          example: "VALIDATION_ERROR"
        mensaje:
          type: string
        errores:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensaje:
                type: string
`;

    // ── Logout ──
    function logout() {
      sessionStorage.removeItem('nt_dev_token');
      sessionStorage.removeItem('nt_dev_user');
      sessionStorage.removeItem('nt_dev_login_ts');
      window.location.replace('./login.html');
    }

    // ── Show user in topbar ──
    var u = sessionStorage.getItem('nt_dev_user');
    if (u) { var badge = document.getElementById('user-badge'); if (badge) badge.textContent = u; }

    const el = document.getElementById('elements-api');
    if (el) {
      el.apiDescriptionDocument = spec;
    } else {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('elements-api').apiDescriptionDocument = spec;
      });
    }
  </script>
</body>
</html>
